    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

    // text from that direct parent; requests from below are honored only

      // root's never-relay rule) are what hold in fully opaque chains

      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

border-box\">\n    <div style=\"width:360px;max-width:100%;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n        <img src=\"59a0585b-118d-4601-bb33-ec6fb1cbfdb6\" alt=\"Oneput AI\" style=\"height:34px;width:auto\">\n        <p style=\"margin:0;font-size:15px;line-height:24px;color:#6B6B66\">Oneput collects your company's data by talking to the people who own it, and hands back a structured, sourced record.<\u002Fp>\n      <\u002Fdiv>\n      <div data-tour=\"signin\" style=\"background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <label style=\"font-size:13px;font-weight:500;color:#1F1F1E\">Email<\u002Flabel>\n          <input type=\"email\" sc-camel-default-value=\"founder@oneput.co\" style=\"min-height:36px;padding:0 12px;border:1px solid #D5D5D1;border-radius:6px;font-size:14px;font-family:inherit;color:#1F1F1E;background:#FFFFFF;outline-color:#2F4BFF;line-height:21px\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n            <label style=\"font-size:13px;font-weight:500;color:#1F1F1E\">Password<\u002Flabel>\n            <a href=\"#\" style=\"font-size:12px\">Forgot password<\u002Fa>\n          <\u002Fdiv>\n          <input type=\"password\" sc-camel-default-value=\"············\" style=\"min-height:36px;padding:0 12px;border:1px solid #D5D5D1;border-radius:6px;font-size:14px;font-family:inherit;color:#1F1F1E;background:#FFFFFF;outline-color:#2F4BFF;line-height:21px\">\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ signInAdmin }}\" style=\"min-height:36px;border-radius:6px;border:1px solid #2F4BFF;background:#2F4BFF;color:#FFFFFF;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:21px\" style-hover=\"background:#2740E0\">Sign in<\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"flex:1;height:1px;background:#E6E6E3;min-width:0\"><\u002Fspan>\n          <span style=\"font-size:12px;color:#9C9C96\">or<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:#E6E6E3;min-width:0\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <button sc-camel-on-click=\"{{ signInAdmin }}\" style=\"min-height:36px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:21px\" style-hover=\"background:#F1F1EF\">Continue with Google<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ signInAdmin }}\" style=\"min-height:36px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:21px\" style-hover=\"background:#F1F1EF\">Continue with Microsoft<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\">\n        <span style=\"display:inline-block;padding:5px 14px;border-radius:12px;background:#F1F1EF;color:#6B6B66;font-size:11.5px;font-weight:500;line-height:16px;text-align:center\">Demo. Sign in as admin or member.<\u002Fspan>\n        <div style=\"display:flex;gap:8px\">\n          <button sc-camel-on-click=\"{{ signInAdmin }}\" style=\"min-height:28px;padding:0 12px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:18px\" style-hover=\"background:#F1F1EF\">Admin<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ signInMember }}\" style=\"min-height:28px;pad \u002Fdiv><div style=\"font-size:11px;color:#6B6B66;margin-top:2px\">one line on each, drafted from the sheet<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;color:#9C9C96;font-weight:500;margin-bottom:2px\">Why it is flagged<\u002Fdiv><div style=\"line-height:18px;color:#6B6B66\">Row 9 looks like a duplicate of row 6, same client, same amount, one month apart. Not sure, please check.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;padding:12px 16px\">\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ toastAccept }}\" style=\"min-height:32px;padding:0 14px;border-radius:6px;border:1px solid #2F4BFF;background:#2F4BFF;color:#FFFFFF;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#2740E0\">Accept<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ toastReask }}\" style=\"min-height:32px;padding:0 12px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Ask the studio lead about row 9<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ toastReject }}\" style=\"min-height:32px;padding:0 12px;border-radius:6px;border:none;background:none;color:#A93B31;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#FBEBE9\">Reject<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ openAiAudit }}\" style=\"min-height:32px;padding:0 12px;border-radius:6px;border:none;background:none;color:#6B6B66;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Ask One sons, 9 workshops, FY2025<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6B6B66;margin-top:2px\">214 registered + 180 invoiced seats + about 60 counted in photos. Overlap between sources is possible.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;padding:12px 16px\">\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ toastAccept }}\" style=\"min-height:32px;padding:0 14px;border-radius:6px;border:1px solid #2F4BFF;background:#2F4BFF;color:#FFFFFF;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#2740E0\">Accept as approximate<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ toastReask }}\" style=\"min-height:32px;padding:0 12px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Ask ops for more sources<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ toastReject }}\" style=\"min-height:32px;padding:0 12px;border-radius:6px;border:none;background:none;color:#A93B31;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#FBEBE9\">Reject<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ openAiAudit }}\" style=\"min-height:32px;padding:0 12px;border-radius:6px;border:none;background:none;color:#6B6B66;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Ask Oneput<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #F1F1EF;margin-top:10px;padding-top:8px;font-size:11px;color:#9C9C96;font-family:'IBM Plex Mono' ent-color:#2F4BFF\">Include provenance, source and submitter per value<\u002Flabel>\n              <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ true }}\" sc-camel-read-only=\"{{ true }}\" style=\"accent-color:#2F4BFF\">Include estimates, footnoted as approximate<\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:flex-end;margin-top:14px\">\n            <button sc-camel-on-click=\"{{ toastExport }}\" style=\"min-height:32px;padding:0 16px;border-radius:6px;border:1px solid #2F4BFF;background:#2F4BFF;color:#FFFFFF;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#2740E0\">Generate the {{ exportFormat }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:center\">\n          <span style=\"width:24px;min-height:24px;border-radius:50%;background:#EBEEFF;color:#2F4BFF;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:17px\">AI<\u002Fspan>\n          <input placeholder=\"Scope 1 and 2 only, in tonnes, one page for the board\" style=\"flex:1;min-width:0;min-height:32px;border:1px solid #D5D5D1;border-radius:6px;padding:0 12px;font-size:13px;font-family:inherit;outline-color:#2F4BFF;line-height:20px\">\n          <button sc-camel-on-click=\"{{ openAiExport }}\" style=\"min-height:32px;padding:0 14px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Describe what you need<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;overflow:hidden\">\n          <div style=\"padding:12px 16px;border-bottom:1px solid #E6E6E3;font-size:13px;font-weight:700\">History<\u002Fdiv>\n          <sc-for list=\"{{ exportHistory }}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid #F1F1EF;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:220px\">\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500\">📄 {{ h.file }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#9C9C96;margin-top:2px\">{{ h.when }} · {{ h.by }} · {{ h.scope }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ h.share }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display:inline-flex;align-items:center;gap:8px;min-height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:500;color:#2B5FA8;background:#E8EFF9;white-space:nowrap;line-height:17px\">Read-only link, live<button sc-camel-on-click=\"{{ h.revoke }}\" style=\"background:none;border:none;color:#A93B31;font-size:11.5px;font-weight:500;font-family:inherit;cursor:pointer;padding:0;text-decoration:underline;white-space:nowrap\">Revoke<\u002Fbutton><\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ h.noShare }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ toastShare }}\" style=\"min-height:24px;padding:0 10px;border-radius:999px;border:1px solid #D5D5D1;background:#FFFFFF;color:#6B6B66;font-size:11.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:17px\" style-hover=\"background:#F1F1EF\">Create a share link<\u002Fbutton>\n              <\u002Fsc-if>\n              <button style=\"background:none;border:none;color:#2F4BFF;font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer;padding:0;white-space:nowrap\" style-hover=\"color:#2740E0\">Download<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"padding:10px 16px;font-size:11.5px;color:#9C9C96\">Approval happens between people, outside the tool. A share link is how a draft goes around.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ modalOps03 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(31,31,30,.25);z-index:88\"><\u002Fdiv>\n  <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:440px;max-width:calc(100vw - 48px);background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.10);z-index:90;overflow:hidden\">\n    <div style=\"padding:20px 20px 0\">\n      <span style=\"display:inline-flex;align-items:center;min-height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;color:#A93B31;background:#FBEBE9;white-space:nowrap;line-height:18px\">Cannot be recovered<\u002Fspan>\n      <div style=\"font-size:16px;font-weight:700;margin-top:10px\">Team utilisation <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:#9C9C96\">OPS-03<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:8px 0 0;font-size:13.5px;line-height:20px\">No timesheets were kept in 2025, so utilisation cannot be reconstructed. Starting a log now gives you an FY2026 number, not an FY2025 one, so a start now task will not fix this.<\u002Fp>\n      <p style=\"margin:8px 0 16px;font-size:13px;line-height:19px;color:#6B6B66\">Whatever you choose, the FY2026 tracker proposal stays, so next year this number exists.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #F1F1EF;padding:14px 20px;display:flex;flex-direction:column;gap:8px\">\n      <button sc-camel-on-click=\"{{ ops03Drop }}\" style=\"min-height:38px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;text-align:left;padding:8px 14px;white-space:nowrap\" style-hover=\"background:#F1F1EF\">Drop the metric<span style=\"display:block;font-weight:400;font-size:11.5px;color:#9C9C96;margin-top:1px\">It leaves the FY2025 report and the FY2026 plan keeps it.<\u002Fspan><\u002Fbutton>\n      <button sc-camel-on-click=\"{{ ops03Estimate }}\" style=\"min-height:38px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;text-align:left;padding:8px 14px;white-space:nowrap\" style-hover=\"background:#F1F1EF\">Publish a stated method estimate<span style=\"display:block;font-weight:400;font-size:11.5px;color:#9C9C96;margin-top:1px\">The studio lead states the method, the figure is labelled as an estimate.<\u002Fspan><\u002Fbutton>\n      <button sc-camel-on-click=\"{{ ops03Replace }}\" style=\"min-height:38px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;text-align:left;padding:8px 14px;white-space:nowrap\" style-hover=\"background:#F1F1EF\">Replace with projects per person<span style=\"display:block;font-weight:400;font-size:11.5px;color:#9C9C96;margin-top:1px\">A number the invoices can actually evidence.<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ modalAddMember }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(31,31,30,.25);z-index:88\"><\u002Fdiv>\n  <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:460px;max-width:calc(100vw - 48px);background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.10);z-index:90;padding:20px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px\">\n      <span style=\"font-size:16px;font-weight:700\">Add a member<\u002Fspan>\n      <button sc-camel-on-click=\"{{ closeModal }}\" style=\"background:none;border:none;font-size:15px;color:#9C9C96;cursor:pointer;font-family:inherit;white-space:nowrap\" style-hover=\"color:#1F1F1E\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px\">\n      <div><div style=\"font-size:11.5px;color:#6B6B66;font-weight:500;margin-bottom:4px\">Name<\u002Fdiv><input placeholder=\"Their name\" style=\"width:100%;box-sizing:border-box;min-height:32px;padding:0 10px;border:1px solid #D5D5D1;border-radius:6px;font-size:13px;font-family:inherit;outline-color:#2F4BFF;line-height:20px\"><\u002Fdiv>\n      <div><div style=\"font-size:11.5px;color:#6B6B66;font-weight:500;margin-bottom:4px\">Line or email<\u002Fdiv><input placeholder=\"@line or name@company.co\" style=\"width:100%;box-sizing:border-box;min-height:32px;padding:0 10px;border:1px solid #D5D5D1;border-radius:6px;font-size:13px;font-family:inherit;outline-color:#2F4BFF;line-height:20px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px;color:#6B6B66;font-weight:500;margin-bottom:6px\">Assign points. Oneput's guess is pre-checked.<\u002Fdiv>\n    <div style=\"border:1px solid #E6E6E3;border-radius:8px;max-height:180px;overflow:auto;margin-bottom:14px\">\n      <label style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #F1F1EF;font-size:13px;cursor:pointer\" style-hover=\"background:#F7F7F5\"><input type=\"checkbox\" checked=\"{{ true }}\" sc-camel-read-only=\"{{ true }}\" style=\"accent-color:#2F4BFF\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9C9C96;width:52px\">FIN-04<\u002Fspan>DBD filing confirmation<\u002Flabel>\n      <label style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #F1F1EF;font-size:13px;cursor:pointer\" style-hover=\"background:#F7F7F5\"><input type=\"checkbox\" checked=\"{{ true }}\" sc-camel-read-only=\"{{ true }}\" style=\"accent-color:#2F4BFF\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9C9C96;width:52px\">TAX-01<\u002Fspan>Corporate tax paid<\u002Flabel>\n      <label style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px;cursor:pointer\" style-hover=\"background:#F7F7F5\"><input type=\"checkbox\" style=\"accent-color:#2F4BFF\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9C9C96;width:52px\">PPL-02<\u002Fspan>Freelancers engaged<\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:flex-end;gap:8px\">\n      <button sc-camel-on-click=\"{{ closeModal }}\" style=\"min-height:32px;padding:0 14px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Cancel<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ closeModal }}\" style=\"min-height:32px;padding:0 16px;border-radius:6px;border:1px solid #2F4BFF;background:#2F4BFF;color:#FFFFFF;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:20px\" style-hover=\"background:#2740E0\">Send the invite<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ modalSettings }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(31,31,30,.25);z-index:88\"><\u002Fdiv>\n  <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:760px;max-width:calc(100vw - 48px);height:480px;max-height:calc(100dvh - 48px);background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.10);z-index:90;display:flex;overflow:hidden\">\n    <div style=\"width:200px;flex-shrink:0;background:#F7F7F5;border-right:1px solid #E6E6E3;padding:14px 8px;display:flex;flex-direction:column;gap:2px\">\n      <div style=\"font-size:11px;font-weight:700;color:#9C9C96;padding:0 10px 8px\">Settings<\u002Fdiv>\n      <sc-for list=\"{{ settingsTabs }}\" as=\"t\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ t.go }}\" style=\"text-align:left;background:{{ t.bg }};border:none;border-radius:6px;padding:7px 10px;font-size:13px;font-weight:{{ t.weight }};color:{{ t.color }};font-family:inherit;cursor:pointer;white-space:nowrap\" style-hover=\"background:#E9E9E6\">{{ t.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"flex:1;padding:20px 24px;overflow:auto;position:relative;min-width:0\">\n      <button sc-camel-on-click=\"{{ closeModal }}\" style=\"position:absolute;top:14px;right:16px;background:none;border:none;font-size:15px;color:#9C9C96;cursor:pointer;font-family:inherit;white-space:nowrap\" style-hover=\"color:#1F1F1E\">✕<\u002Fbutton>\n      <div style=\"font-size:15px;font-weight:700;margin-bottom:14px\">{{ settingsTab }}<\u002Fdiv>\n      <sc-if value=\"{{ isTabTeam }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:13px;line-height:20px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #E6E6E3;border-radius:8px\"><div><div style=\"font-weight:500\">Founder<\u002Fdiv><div style=\"font-size:11.5px;color:#9C9C96\">founder@oneput.co<\u002Fdiv><\u002Fdiv><span style=\"font-size:12px;color:#6B6B66\">Admin<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #E6E6E3;border-radius:8px\"><div><div style=\"font-weight:500\">Board observer<\u002Fdiv><div style=\"font-size:11.5px;color:#9C9C96\">Invited 24 Jul, not yet accepted<\u002Fdiv><\u002Fdiv><span style=\"font-size:12px;color:#6B6B66\">Reviewer<\u002Fspan><\u002Fdiv>\n          <button style=\"align-self:flex-start;min-height:30px;padding:0 12px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:19px\" style-hover=\"background:#F1F1EF\">Invite an admin or reviewer<\u002Fbutton>\n          <p style=\"margin:0;font-size:12px;color:#9C9C96\">Two roles only. Admins run the project, reviewers read everything and work in Audit.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isTabChannels }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;line-height:20px;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ settingsChannels }}\" as=\"sc\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #E6E6E3;border-radius:8px;gap:10px\"><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:8px;height:8px;border-radius:2px;background:{{ sc.dot }};flex-shrink:0\"><\u002Fspan><span style=\"font-weight:500\">{{ sc.label }}<\u002Fspan><\u002Fdiv><span style=\"font-size:12px;color:{{ sc.stColor }};white-space:nowrap\">{{ sc.state }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"margin-top:4px\"><div style=\"font-weight:500;margin-bottom:4px\">Quiet hours<\u002Fdiv><div style=\"font-size:12.5px;color:#6B6B66\">No member messages between 21:00 and 08:00.<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-weight:500;margin-bottom:4px\">Reminder tone<\u002Fdiv><div style=\"display:flex;gap:6px\"><span style=\"min-height:24px;padding:0 10px;border-radius:999px;border:1px solid #D5D5D1;font-size:12px;display:inline-flex;align-items:center;color:#6B6B66;white-space:nowrap;line-height:18px\">Gentle<\u002Fspan><span style=\"min-height:24px;padding:0 10px;border-radius:999px;border:1px solid #1F1F1E;background:#1F1F1E;color:#FFFFFF;font-size:12px;display:inline-flex;align-items:center;white-space:nowrap;line-height:18px\">Standard<\u002Fspan><span style=\"min-height:24px;padding:0 10px;border-radius:999px;border:1px solid #D5D5D1;font-size:12px;display:inline-flex;align-items:center;color:#6B6B66;white-space:nowrap;line-height:18px\">Persistent<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isTabLanguage }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;line-height:20px;display:flex;flex-direction:column;gap:10px\">\n          <div><div style=\"font-weight:500;margin-bottom:2px\">Project default<\u002Fdiv><div style=\"color:#6B6B66\">English. Oneput still speaks each member's own language.<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-weight:500;margin-bottom:2px\">Per member<\u002Fdiv><div style=\"color:#6B6B66\">External accountant, Thai, detected from the invite address. Everyone else, English.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isTabPlan }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;line-height:20px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;justify-content:space-between;padding:8px 12px;border:1px solid #E6E6E3;border-radius:8px\"><span>Internal deadline<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">12 Sep 2026<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:8px 12px;border:1px solid #E6E6E3;border-radius:8px\"><span>Consolidation window<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">5 to 12 Sep<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:8px 12px;border:1px solid #E6E6E3;border-radius:8px\"><span>Ask buffer before each due<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">3 business days<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-size:12px;color:#9C9C96\">Editing any date re-validates the whole plan before saving.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isTabPeriod }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;line-height:20px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;padding:8px 12px;border:1px solid #E6E6E3;border-radius:8px\"><span>Period covered<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">1 Jan to 31 Dec 2025<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:12px;border:1px solid #E6E6E3;border-radius:8px\">\n            <div style=\"font-weight:500\">Open FY2026<\u002Fdiv>\n            <p style=\"margin:4px 0 10px;font-size:12.5px;color:#6B6B66\">Copies the data list and the plan, shifted to FY2026 dates. The three trackers carry forward already running. Member threads stay open, progress resets.<\u002Fp>\n            <button sc-camel-on-click=\"{{ goAnchor }}\" style=\"min-height:30px;padding:0 12px;border-radius:6px;border:1px solid #2F4BFF;background:#2F4BFF;color:#FFFFFF;font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:19px\" style-hover=\"background:#2740E0\">Open FY2026<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isTabBilling }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;line-height:20px;color:#6B6B66\">Studio plan, 6 member seats in use. Billing sits with Admins only.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isTabDanger }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;line-height:20px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"padding:12px;border:1px solid #E0B7B3;border-radius:8px\">\n            <div style=\"font-weight:500;color:#A93B31\">Delete this project<\u002Fdiv>\n            <p style=\"margin:4px 0 0;font-size:12.5px;color:#6B6B66\">Deleting ONEPUT FY2025 removes 26 points, 21 answers and every source file. Members are told the collection ended. You will be asked to type the project name.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isInvite }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Invite\" style=\"min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box\">\n    <div style=\"width:380px;max-width:100%\">\n      <div style=\"display:flex;gap:4px;margin-bottom:10px\">\n        <sc-for list=\"{{ inviteTabs }}\" as=\"it\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ it.go }}\" style=\"min-height:28px;padding:0 12px;border-radius:999px;border:1px solid {{ it.border }};background:{{ it.bg }};color:{{ it.color }};font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:18px\" style-hover=\"background:#F1F1EF\">{{ it.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div data-tour=\"m-invite\" style=\"background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.10)\">\n        <div style=\"background:{{ inviteHeadBg }};color:{{ inviteHeadColor }};padding:12px 16px;display:flex;align-items:center;gap:10px\">\n          <img src=\"17e2aaa3-716d-48c3-bdae-b119af9d7f99\" alt=\"\" style=\"width:28px;height:28px;border-radius:50%;background:#FFFFFF;flex-shrink:0\">\n          <div style=\"min-width:0\">\n            <div style=\"font-size:13.5px;font-weight:700\">Oneput<\u002Fdiv>\n            <div style=\"font-size:11px;opacity:.85\">{{ inviteHeadSub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:{{ inviteBodyBg }};padding:16px;display:flex;flex-direction:column;gap:10px;min-height:260px\">\n          <div style=\"align-self:center;font-size:10.5px;color:#9C9C96;background:#FFFFFF;border-radius:999px;padding:2px 10px;white-space:nowrap\">Today, 09:02<\u002Fdiv>\n          <div style=\"align-self:flex-start;max-width:88%;background:#FFFFFF;border-radius:2px 12px 12px 12px;padding:10px 14px;font-size:14px;line-height:22px\">{{ inviteMsg }}<\u002Fdiv>\n          <div style=\"align-self:flex-start;max-width:88%;background:#FFFFFF;border-radius:12px;padding:12px 14px;width:240px\">\n            <div style=\"font-size:13px;line-height:19px;color:#6B6B66;margin-bottom:10px\">{{ inviteSub }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ goAccount }}\" style=\"width:100%;min-height:38px;border-radius:6px;border:1px solid #2F4BFF;background:#2F4BFF;color:#FFFFFF;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:21px\" style-hover=\"background:#2740E0\">Open my workspace<\u002Fbutton>\n            <div style=\"font-size:11.5px;color:#9C9C96;line-height:16px;margin-top:8px\">You can also reply right here, and it will land in the same place.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:10px 14px;border-top:1px solid #E6E6E3;display:flex;gap:8px;align-items:center\">\n          <span style=\"color:#9C9C96;font-size:15px\">📎<\u002Fspan>\n          <input placeholder=\"{{ inviteReplyPlaceholder }}\" style=\"flex:1;min-width:0;min-height:32px;border:1px solid #E6E6E3;border-radius:999px;padding:0 14px;font-size:13px;font-family:inherit;outline-color:#2F4BFF;line-height:20px\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;text-align:center;font-size:12px;line-height:18px;color:#9C9C96\">The invite as the studio lead sees it. Same message, whichever channel they picked. <button sc-camel-on-click=\"{{ signOut }}\" style=\"background:none;border:none;font-size:12px;color:#2F4BFF;font-family: Fspan><button sc-camel-on-click=\"{{ closeSheets }}\" style=\"background:none;border:none;font-size:15px;color:#9C9C96;cursor:pointer;font-family:inherit;min-width:44px;min-height:32px;white-space:nowrap\" style-hover=\"color:#1F1F1E\">✕<\u002Fbutton><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ points }}\" as=\"pt\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ pt.pick }}\" style=\"text-align:left;background:{{ pt.cardBg }};border:1px solid {{ pt.cardBorder }};border-radius:8px;padding:12px 14px;cursor:pointer;font-family:inherit;min-height:44px;white-space:nowrap\">\n              <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:flex-start\">\n                <span style=\"font-size:13.5px;font-weight:500;line-height:18px\">{{ pt.name }}<\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;min-height:19px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:500;white-space:nowrap;color:{{ pt.chipColor }};background:{{ pt.chipBg }};line-height:16px\">{{ pt.chip }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:8px;margin-top:5px\">\n                <span style=\"font-size:11.5px;color:#9C9C96\">{{ pt.last }}<\u002Fspan>\n                <span style=\"font-size:11px;color:#6B6B66;font-family:'IBM Plex Mono',monospace;white-space:nowrap\">{{ pt.due }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ railShow }}\" hint-placeholder-val=\"{{ false }}\">\n  <button sc-camel-on-click=\"{{ openAiPlain }}\" title=\"Ask Oneput\" style=\"position:fixed;top:52px;right:0;bottom:0;width:48px;background:#FFFFFF;border:none;border-left:1px solid #E6E6E3;cursor:pointer;z-index:60;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;font-family:inherit\" style-hover=\"background:#F1F1EF\">\n    <span style=\"position:relative\"><img src=\"17e2aaa3-716d-48c3-bdae-b119af9d7f99\" alt=\"\" style=\"width:24px;height:24px;border-radius:50%\"><span style=\"position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#A93B31;border:1.5px solid #FFFFFF\"><\u002Fspan><\u002Fspan>\n    <span style=\"writing-mode:vertical-rl;font-size:11.5px;font-weight:500;color:#6B6B66;letter-spacing:.02em\">Ask Oneput<\u002Fspan>\n  <\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ fabShow }}\" hint-placeholder-val=\"{{ false }}\">\n  <button sc-camel-on-click=\"{{ openAiPlain }}\" title=\"Ask Oneput\" style=\"position:fixed;bottom:64px;right:16px;width:48px;height:48px;border-radius:50%;background:#FFFFFF;border:1px solid #D5D5D1;box-shadow:0 8px 24px rgba(0,0,0,.10);cursor:pointer;z-index:60;display:flex;align-items:center;justify-content:center;font-family:inherit\">\n    <img src=\"17e2aaa3-716d-48c3-bdae-b119af9d7f99\" alt=\"Ask Oneput\" style=\"width:26px;height:26px;border-radius:50%\">\n  <\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ panelShow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-tour=\"ai-panel\" style=\"position:fixed;top:52px;right:0;bottom:0;width:{{ panelWpx }};max-width:100vw;background:#FFFFFF;border-left:1px solid #E6E6E3;z-index:75;display:flex;flex-direction:column;box-sizing:border-box\">\n    <div style=\"padding:10px 14px;border-bottom:1px solid #E6E6E3;display:flex;align-items:center;gap:10px;flex-shrink:0\">\n      <img src=\"17e2aaa3-716d-48c3-bdae-b119af9d7f99\" alt=\"\" style=\"width:22px;height:22px;border-radius:50%;flex-shrink:0\">\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:13px;font-weight:700;line-height:16px\">Planning this project<\u002Fdiv>\n        <div style=\"font-size:10.5px;color:#9C9C96;font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">data list done · timing now · people next<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeAiPanel }}\" title=\"Collapse\" style=\"background:none;border:none;font-size:14px;color:#9C9C96;cursor:pointer;font-family:inherit;padding:4px;white-space:nowrap\" style-hover=\"color:#1F1F1E\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div ref=\"{{ setupChatRef }}\" style=\"flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0\">\n      <div style=\"align-self:flex-end;max-width:85%;background:#F7F7F5;border:1px solid #E6E6E3;border-radius:8px;padding:10px 14px;font-size:14px;line-height:22px\">We need to collect data for our FY2025 annual report.<\u002Fdiv>\n      <div style=\"align-self:flex-start;max-width:92%;background:#EBEEFF;border-radius:8px 8px 8px 2px;padding:10px 14px;font-size:14px;line-height:22px\">Got it. Do you have last year's report? Drop it here and I'll start from it.<\u002Fdiv>\n      <div data-tour=\"plan-pdf\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"align-self:flex-end;max-width:85%\">\n          <div style=\"background:#FFFFFF;border:1px solid #D5D5D1;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px\">\n            <span style=\"font-size:16px\">📄<\u002Fspan>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500\">ONEPUT-FY2024-annual-report.pdf<\u002Fdiv><div style=\"font-size:11px;color:#9C9C96\">you sent this<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"align-self:flex-start;max-width:92%;background:#EBEEFF;border-radius:8px 8px 8px 2px;padding:10px 14px;font-size:14px;line-height:22px\">I read it. FY2024 reported 24 points across finance, operations, ventures, people and governance. They're on the left, carried into FY2025. Before timing, one question. Are there rules you need to follow this year?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"align-self:flex-end;max-width:85%;background:#F7F7F5;border:1px solid #E6E6E3;border-radius:8px;padding:10px 14px;font-size:14px;line-height:22px\">We may file 56-1 One Report next year. Check what the SEC expects.<\u002Fdiv>\n      <div data-tour=\"plan-research\" style=\"align-self:flex-start;max-width:92%\">\n        <div style=\"background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px\">\n          <span style=\"font-size:16px\">🌐<\u002Fspan>\n          <div><div style=\"font-size:13px;font-weight:500\">Reading SEC guidance on 56-1 One Report<\u002Fdiv><span style=\"display:inline-flex;align-items:center;gap:4px;min-height:20px;padding:0 8px;border-radius:4px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:#6B6B66;border:1px solid #D5D5D1;margin-top:4px;white-space:nowrap;line-height:17px\">sec.or.th<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"align-self:flex-start;max-width:92%;background:#EBEEFF;border-radius:8px 8px 8px 2px;padding:10px 14px;font-size:14px;line-height:22px\">At your size the full 56-1 filing is not required yet. I added three governance points it will expect, so the FY2026 filing starts ready. Now timing. When does the report need to be out?<\u002Fdiv>\n      <div style=\"align-self:flex-end;max-width:85%;background:#F7F7F5;border:1px solid #E6E6E3;border-radius:8px;padding:10px 14px;font-size:14px;line-height:22px\">End of September.<\u002Fdiv>\n      <div style=\"align-self:flex-start;max-width:92%;background:#EBEEFF;border-radius:8px 8px 8px 2px;padding:10px 14px;font-size:14px;line-height:22px\">Then here is the ladder I propose, working backward from 30 Sep.<\u002Fdiv>\n      <div data-tour=\"plan-ladder\" style=\"align-self:flex-start;width:92%;background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;padding:12px 14px\">\n        <div style=\"font-size:12px;font-weight:500;color:#6B6B66;margin-bottom:8px\">Work-back ladder, FY2025<\u002Fdiv>\n        <sc-for list=\"{{ ladder }}\" as=\"l\" hint-placeholder-count=\"9\">\n          <div style=\"display:flex;gap:10px;padding:3px 0;font-size:13px;line-height:18px\"><span style=\"font-family:'IBM Plex Mono',monospace;color:#2F4BFF;width:52px;flex-shrink:0;font-weight:500\">{{ l.date }}<\u002Fspan><span style=\"color:#1F1F1E\">{{ l.what }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start\">\n        <button style=\"min-height:26px;padding:0 12px;border-radius:999px;border:1px solid #2F4BFF;background:#FFFFFF;color:#2F4BFF;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:18px\" style-hover=\"background:#EBEEFF\">Looks right<\u002Fbutton>\n        <button style=\"min-height:26px;padding:0 12px;border-radius:999px;border:1px solid #D5D5D1;background:#FFFFFF;color:#6B6B66;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:18px\" style-hover=\"background:#F1F1EF\">Move a date<\u002Fbutton>\n        <button style=\"min-height:26px;padding:0 12px;border-radius:999px;border:1px solid #D5D5D1;background:#FFFFFF;color:#6B6B66;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:18px\" style-hover=\"background:#F1F1EF\">Why these windows<\u002Fbutton>\n      <\u002Fdiv>\n      <div data-tour=\"plan-ops03\" style=\"align-self:flex-start;width:92%;flex-shrink:0;background:#FFFFFF;border:1px solid #E8C9C5;border-radius:8px;overflow:hidden\">\n        <div style=\"padding:12px 14px 0\">\n          <span style=\"display:inline-flex;align-items:center;gap:6px;min-height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;color:#A93B31;background:#FBEBE9;white-space:nowrap;line-height:18px\">Cannot be recovered<\u002Fspan>\n          <div style=\"font-size:14px;font-weight:700;margin-top:8px\">Team utilisation <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:#9C9C96\">OPS-03<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:6px 0 0;font-size:13px;line-height:20px;color:#1F1F1E\">No timesheets were kept in 2025, so utilisation cannot be reconstructed. Starting a log now gives you an FY2026 number, not an FY2025 one, so a start now task will not fix this.<\u002Fp>\n          <p style=\"margin:6px 0 12px;font-size:13px;line-height:20px;color:#6B6B66\">Three honest ways to handle it.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #F1F1EF;padding:10px 14px;display:flex;flex-direction:column;gap:6px\">\n          <button sc-camel-on-click=\"{{ ops03Drop }}\" style=\"min-height:32px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;text-align:left;padding:0 12px;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Drop the metric<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ ops03Estimate }}\" style=\"min-height:32px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;text-align:left;padding:0 12px;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Publish a stated method estimate<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ ops03Replace }}\" style=\"min-height:32px;border-radius:6px;border:1px solid #D5D5D1;background:#FFFFFF;color:#1F1F1E;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;text-align:left;padding:0 12px;white-space:nowrap;line-height:20px\" style-hover=\"background:#F1F1EF\">Replace with projects per person<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"align-self:flex-start;max-width:92%;background:#EBEEFF;border-radius:8px 8px 8px 2px;padding:10px 14px;font-size:14px;line-height:22px\">And so FY2026 does not repeat this, I have three trackers ready to begin on 1 Aug. They are listed under the checklist, confirm them and they carry into the next period.<\u002Fdiv>\n      <div style=\"align-self:flex-start;max-width:92%;background:#EBEEFF;border-radius:8px 8px 8px 2px;padding:10px 14px;font-size:14px;line-height:22px\">One more thing that saves everyone time. Headcount and invoices usually live in a system already. Your invoices are in a Google Sheet, connect it and nobody has to be asked for the project list. Want me to pull from it and just have the studio lead confirm?<\u002Fdiv>\n      <div style=\"align-self:flex-end;max-width:85%;background:#F7F7F5;border:1px solid #E6E6E3;border-radius:8px;padding:10px 14px;font-size:14px;line-height:22px\">Yes, connect it.<\u002Fdiv>\n      <div style=\"align-self:flex-start;max-width:92%\">\n        <div style=\"background:#FFFFFF;border:1px solid #E6E6E3;border-radius:8px;padding:12px 14px\">\n          <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:14px\">⚡<\u002Fspan><span style=\"font-size:13px;font-weight:700\">Invoices 2025 · Google Sheets · connected<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12px;line-height:17px;color:#6B6B66;margin-top:4px\">Feeds client projects and repeat client rate. The studio lead confirms what's pulled.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #E6E6E3;padding:10px 12px;flex-shrink:0\">\n      <sc-if value=\"{{ hasAiCtx }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:8px\">\n          <span style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:22px;padding:0 10px;border-radius:999px;background:#EBEEFF;color:#2F4BFF;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:17px\">{{ aiCtx.label }}<button sc-camel-on-click=\"{{ clear
